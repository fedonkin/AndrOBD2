# Sourced guidance subset; see docs/jaguar-dtc-guidance.md
jag_dtc_causes_scope=Справка: Jaguar S-TYPE MY2001–2002, VIN от L86902 (P20001). Сверить применимость к ЭБУ.
jag_dtc_causes_heading=Возможные причины (не диагноз):
jag_dtc_causes_caution=Проверить проводку и измерения до замены деталей. Сам код не устанавливает неисправную деталь.
jag_dtc_causes_P0102=Засорённый воздушный фильтр; повышенное сопротивление, обрыв или периодическое замыкание сигнальной цепи MAF на массу; обрыв/замыкание питания MAF; неисправность датчика MAF.
jag_dtc_causes_P0103=Обрыв опорной массы MAF; замыкание сигнальной цепи на высокое напряжение; неисправность MAF.
jag_dtc_causes_P0180=Отключён датчик температуры топлива EFT; повышенное сопротивление, обрыв или замыкание его цепи к PCM на массу/высокое напряжение; неисправность EFT.
jag_dtc_causes_P0190=Обрыв опорной массы или опорного питания датчика давления топлива IP; обрыв, повышенное сопротивление или замыкание сигнальной цепи на массу/высокое напряжение; неисправность IP.
jag_dtc_causes_P0192=Обрыв опорного питания IP; обрыв, повышенное сопротивление или замыкание сигнальной цепи на массу; неисправность датчика давления топлива IP.
jag_dtc_causes_P0193=Обрыв опорной массы IP; замыкание сигнальной цепи на высокое напряжение; неисправность датчика давления топлива IP.
jag_dtc_causes_P0196=Повышенное сопротивление цепи EOT при нагреве или периодически; неисправность датчика температуры масла. Подстановка PCM по документу: CHT для V6, ECT для V8.
jag_dtc_causes_P0116=Низкий уровень/загрязнение охлаждающей жидкости; неисправность термостата; плохой контакт CHT с головкой V6; повышенное сопротивление, обрыв или замыкание цепи ECT/CHT на высокое напряжение; неисправность датчика.
jag_dtc_causes_P0125=Низкий уровень/загрязнение охлаждающей жидкости; термостат; плохой контакт CHT с головкой V6; повышенное сопротивление, обрыв или замыкание цепи ECT/CHT на высокое напряжение; вентилятор постоянно на высокой скорости; избыточный обдув из-за повреждений/отсутствующих панелей.
jag_dtc_causes_P0171=Банк 1: пропуски зажигания; негерметичность между MAF и дросселем; ограничение подачи фильтром/топливной системой/форсунками; неисправность IP, связанная с низким давлением; малая подача насоса; проводка лямбда-зондов; утечка выхлопа до катализатора; неверные входные сигналы ECT/CHT, MAF, IAT, IP, EFT, TP или TACM.
jag_dtc_causes_P0174=Банк 2: пропуски зажигания; негерметичность между MAF и дросселем; ограничение подачи фильтром/топливной системой/форсунками; неисправность IP, связанная с низким давлением; малая подача насоса; проводка лямбда-зондов; утечка выхлопа до катализатора; неверные входные сигналы ECT/CHT, MAF, IAT, IP, EFT, TP или TACM.
jag_dtc_causes_P0172=Банк 1: засорённый воздушный фильтр; негерметичные форсунки; неисправность IP, связанная с высоким давлением; неверные сигналы ECT/CHT, MAF, IAT, IP, EFT, TP или TACM. Наличие EFT в списке причин не доказывает его неисправность.
jag_dtc_causes_P0175=Банк 2: засорённый воздушный фильтр; негерметичные форсунки; неисправность IP, связанная с высоким давлением; неверные сигналы ECT/CHT, MAF, IAT, IP, EFT, TP или TACM. Наличие EFT в списке причин не доказывает его неисправность.
jag_dtc_causes_P0135=B1S1: отключён лямбда-зонд; обрыв питания нагревателя; обрыв/замыкание проводки нагревателя к блоку управления; неисправность нагревателя.
jag_dtc_causes_P0141=B1S2: отключён лямбда-зонд; обрыв питания нагревателя; обрыв/замыкание проводки нагревателя к блоку управления; неисправность нагревателя.
jag_dtc_causes_P0155=B2S1: отключён лямбда-зонд; обрыв питания нагревателя; обрыв/замыкание проводки нагревателя к блоку управления; неисправность нагревателя.
jag_dtc_causes_P0161=B2S2: отключён лямбда-зонд; обрыв питания нагревателя; обрыв/замыкание проводки нагревателя к блоку управления; неисправность нагревателя.
