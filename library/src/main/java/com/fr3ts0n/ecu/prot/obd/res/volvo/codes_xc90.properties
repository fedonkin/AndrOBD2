# Generic Volvo P-code reference, NOT an XC90 ECU-variant/VIDA catalogue.
# Provenance and scope: docs/volvo-xc90.md
P1000=ECM circuit fault; not a readiness marker [Volvo reference; verify ECU/year]
P1111=Ambient temperature signal outside expected range; not System Pass [Volvo reference; verify ECU/year]
P1171=Bank 1: lean mixture at partial load [Volvo reference; verify ECU/year]
P1174=Bank 1: lean mixture at full load [Volvo reference; verify ECU/year]
P1175=Bank 1: rich mixture at full load [Volvo reference; verify ECU/year]
P1238=Turbocharger boost regulation fault [Volvo reference; verify ECU/year]
P1332=Camshaft adjustment valve fault [Volvo reference; verify ECU/year]
P1480=Cooling fan controller: low signal [Volvo reference; verify ECU/year]
P1481=Cooling fan relay: low signal [Volvo reference; verify ECU/year]
P1550=Implausible vehicle-speed message [Volvo reference; verify ECU/year]
P1618=TCM requests the malfunction indicator; read transmission faults [Volvo reference; verify ECU/year]
P1633=ABS vehicle-speed message timed out [Volvo reference; verify ECU/year]
P1670=Immobilizer communication or authorization fault [Volvo reference; verify ECU/year]
P1671=Camshaft actuator performance outside expected range [Volvo reference; verify ECU/year]
P1672=ECM 5 V supply output low [Volvo reference; verify ECU/year]
