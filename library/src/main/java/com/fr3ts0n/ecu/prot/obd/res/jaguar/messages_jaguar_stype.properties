# Sourced guidance subset; see docs/jaguar-dtc-guidance.md
jag_dtc_causes_scope=Reference: Jaguar S-TYPE MY2001–2002, VIN L86902 onward (P20001). Confirm applicability to this ECU.
jag_dtc_causes_heading=Possible causes (not a diagnosis):
jag_dtc_causes_caution=Check wiring and measurements before replacing parts. A DTC does not identify a failed part by itself.
jag_dtc_causes_P0102=Restricted air filter; high resistance/open circuit or intermittent ground short in the MAF signal wiring; MAF supply open/ground short; MAF sensor fault.
jag_dtc_causes_P0103=Open MAF reference ground; MAF signal shorted to high voltage; MAF sensor fault.
jag_dtc_causes_P0180=EFT disconnected; high resistance, open circuit or short to ground/high voltage between EFT and PCM; EFT sensor fault.
jag_dtc_causes_P0190=Open IP sensor reference ground or reference supply; IP signal wiring open, high resistance or short to ground/high voltage; IP sensor fault.
jag_dtc_causes_P0192=Open IP reference supply; IP signal wiring open, high resistance or short to ground; IP sensor fault.
jag_dtc_causes_P0193=Open IP reference ground; IP signal shorted to high voltage; IP sensor fault.
jag_dtc_causes_P0196=EOT signal wiring resistance too high when hot or intermittently high; EOT sensor fault. Documented PCM fallback: CHT on V6, ECT on V8.
jag_dtc_causes_P0116=Low/contaminated coolant; thermostat fault; poor CHT contact with the V6 cylinder head; ECT/CHT signal wiring high resistance, open or short to high voltage; ECT/CHT sensor fault.
jag_dtc_causes_P0125=Low/contaminated coolant; thermostat fault; poor CHT contact with V6 cylinder head; ECT/CHT wiring high resistance, open or short to high voltage; cooling fan stuck on high; excessive engine-bay airflow due to damage/missing panels.
jag_dtc_causes_P0171=Bank 1: misfire; intake leak between MAF and throttle; restricted fuel filter/system or injectors; pressure-sensor fault associated with low pressure; low pump output; oxygen-sensor wiring fault; exhaust leak before catalyst; incorrect PCM input from ECT/CHT, MAF, IAT, IP, EFT, TP or TACM.
jag_dtc_causes_P0174=Bank 2: misfire; intake leak between MAF and throttle; restricted fuel filter/system or injectors; pressure-sensor fault associated with low pressure; low pump output; oxygen-sensor wiring fault; exhaust leak before catalyst; incorrect PCM input from ECT/CHT, MAF, IAT, IP, EFT, TP or TACM.
jag_dtc_causes_P0172=Bank 1: restricted air filter; leaking injectors; fuel-pressure sensor fault associated with high pressure; incorrect PCM input from ECT/CHT, MAF, IAT, IP, EFT, TP or TACM.
jag_dtc_causes_P0175=Bank 2: restricted air filter; leaking injectors; fuel-pressure sensor fault associated with high pressure; incorrect PCM input from ECT/CHT, MAF, IAT, IP, EFT, TP or TACM.
jag_dtc_causes_P0135=B1S1: disconnected oxygen sensor; open heater power supply; open/shorted heater wiring to control module; heater element fault.
jag_dtc_causes_P0141=B1S2: disconnected oxygen sensor; open heater power supply; open/shorted heater wiring to control module; heater element fault.
jag_dtc_causes_P0155=B2S1: disconnected oxygen sensor; open heater power supply; open/shorted heater wiring to control module; heater element fault.
jag_dtc_causes_P0161=B2S2: disconnected oxygen sensor; open heater power supply; open/shorted heater wiring to control module; heater element fault.
